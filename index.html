<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist</title>
  <!-- Biblioteca para drag-and-drop no celular -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <!-- Biblioteca para efeito de confetes -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      padding: 20px 12px;
      margin: 0;
      min-height: 100vh;
    }
    .container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      height: fit-content;
      overflow: hidden;
    }
    h1 {
      margin-top: 0;
      color: #1a1a1a;
      font-size: 24px;
      text-align: center;
      margin-bottom: 12px;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      background: #f0f4f8;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 600;
      color: #444;
    }
    .stats span strong {
      color: #007bff;
    }
    .stats span.done-count strong {
      color: #28a745;
    }
    .input-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      width: 100%;
    }
    @media (min-width: 400px) {
      .input-container {
        flex-direction: row;
      }
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dcdcdc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #007bff;
    }
    button.add-btn {
      width: 100%;
      padding: 12px 18px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    @media (min-width: 400px) {
      button.add-btn {
        width: auto;
      }
    }
    button.add-btn:active {
      background-color: #0056b3;
    }
    .action-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }
    button.reset-btn {
      background-color: #e9ecef;
      color: #495057;
      border: 1px solid #ced4da;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button.reset-btn:active {
      background-color: #dee2e6;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
    }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f9f9f9;
      padding: 12px 14px;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      margin-bottom: 10px;
      touch-action: manipulation;
      transition: background-color 0.3s, border-color 0.3s;
    }
    /* Estilo para quando a tarefa é concluída (fundo verde) */
    li.completed {
      background-color: #e8f5e9;
      border-color: #c8e6c9;
    }
    .sortable-ghost {
      opacity: 0.4;
      background: #eef5ff;
    }
    .drag-handle {
      color: #aaa;
      font-size: 18px;
      cursor: grab;
      padding: 4px 8px;
      touch-action: none;
    }
    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: #28a745; /* Checkbox verde */
      flex-shrink: 0;
    }
    .task-text {
      flex: 1;
      font-size: 16px;
      color: #333;
      word-break: break-word;
      line-height: 1.4;
    }
    li.completed .task-text {
      text-decoration: line-through;
      color: #2e7d32;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #ff4d4d;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .delete-btn:active {
      color: #cc0000;
      background-color: #ffeeee;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Checklist</h1>
    
    <!-- Contador de Tarefas -->
    <div class="stats">
      <span>Faltam: <strong id="pendingCount">0</strong></span>
      <span class="done-count">Concluídas: <strong id="completedCount">0</strong></span>
    </div>

    <div class="input-container">
      <input type="text" id="taskInput" placeholder="Digite uma nova tarefa...">
      <button class="add-btn" onclick="addTask()">Adicionar</button>
    </div>

    <!-- Botão de Limpar/Resetar para o próximo dia -->
    <div class="action-bar">
      <button class="reset-btn" onclick="resetCheckboxes()">🔄 Próximo dia (Desmarcar tudo)</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script>
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');
    const pendingCountEl = document.getElementById('pendingCount');
    const completedCountEl = document.getElementById('completedCount');

    const sortable = new Sortable(taskList, {
      handle: '.drag-handle',
      animation: 150,
      ghostClass: 'sortable-ghost',
      onEnd: function() {
        saveTasks();
      }
    });

    document.addEventListener('DOMContentLoaded', loadTasks);

    taskInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addTask();
      }
    });

    function addTask(text = null, completed = false) {
      const taskText = text || taskInput.value.trim();
      if (taskText === '') return;

      const li = document.createElement('li');
      if (completed) li.classList.add('completed');

      li.innerHTML = `
        <span class="drag-handle">☰</span>
        <input type="checkbox" ${completed ? 'checked' : ''} onchange="toggleComplete(this)">
        <span class="task-text">${escapeHtml(taskText)}</span>
        <button class="delete-btn" onclick="deleteTask(this)">✕</button>
      `;

      taskList.appendChild(li);

      if (!text) {
        taskInput.value = '';
        saveTasks();
      } else {
        updateStats();
      }
    }

    function toggleComplete(checkbox) {
      const li = checkbox.parentElement;
      if (checkbox.checked) {
        li.classList.add('completed');
      } else {
        li.classList.remove('completed');
      }
      saveTasks();
      checkAllCompleted();
    }

    function deleteTask(btn) {
      const li = btn.parentElement;
      li.remove();
      saveTasks();
    }

    function resetCheckboxes() {
      const checkboxes = document.querySelectorAll('#taskList input[type="checkbox"]');
      if (checkboxes.length === 0) return;

      checkboxes.forEach(cb => {
        cb.checked = false;
        cb.parentElement.classList.remove('completed');
      });
      saveTasks();
    }

    function updateStats() {
      const total = document.querySelectorAll('#taskList li').length;
      const completed = document.querySelectorAll('#taskList li.completed').length;
      const pending = total - completed;

      pendingCountEl.innerText = pending;
      completedCountEl.innerText = completed;
    }

    function checkAllCompleted() {
      const total = document.querySelectorAll('#taskList li').length;
      const completed = document.querySelectorAll('#taskList li.completed').length;

      if (total > 0 && total === completed) {
        // Dispara o efeito de confetes
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    function saveTasks() {
      const tasks = [];
      document.querySelectorAll('#taskList li').forEach(li => {
        tasks.push({
          text: li.querySelector('.task-text').innerText,
          completed: li.classList.contains('completed')
        });
      });
      localStorage.setItem('myTodoList', JSON.stringify(tasks));
      updateStats();
    }

    function loadTasks() {
      const savedTasks = JSON.parse(localStorage.getItem('myTodoList')) || [];
      savedTasks.forEach(task => addTask(task.text, task.completed));
      updateStats();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>

</body>
</html>
